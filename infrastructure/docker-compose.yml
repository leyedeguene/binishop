# ==========================================
# BINISHOP — INFRASTRUCTURE LOCALE
# Docker Compose pour l'environnement de
# développement local e-commerce
# ==========================================

services:
  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: binishop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binishop_local_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-binishop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-binishop} -d ${POSTGRES_DB:-binishop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - binishop-network

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: binishop-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-binishop_redis_dev_2026}
      --appendonly yes
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - binishop-network

  # --- MinIO S3 ---
  minio:
    image: minio/minio:latest
    container_name: binishop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-binishop_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-binishop_minio_secret_key_2026}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - binishop-network

  # --- Medusa.js Backend ---
  medusa:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: binishop-medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-binishop}:${POSTGRES_PASSWORD:-binishop_local_dev_2026}@postgres:5432/${POSTGRES_DB:-binishop}
      DATABASE_TYPE: postgres
      # Redis
      REDIS_URL: redis://default:${REDIS_PASSWORD:-binishop_redis_dev_2026}@redis:6379
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-binishop_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-binishop_minio_secret_key_2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-binishop-media}
      MINIO_REGION: ${MINIO_REGION:-eu-west-1}
      # Medusa
      NODE_ENV: development
      PORT: 9000
      JWT_SECRET: ${JWT_SECRET:-binishop_jwt_secret_dev_2026_super_secret}
      COOKIE_SECRET: ${COOKIE_SECRET:-binishop_cookie_secret_dev_2026}
      MEDUSA_ADMIN_ONBOARDING_TYPE: local
      DISABLE_ADMIN_ONBOARDING: false
      STORE_CORS: http://localhost:8000,http://localhost:3000,http://localhost:5173,http://localhost:8080
      ADMIN_CORS: http://localhost:8000,http://localhost:3000,http://localhost:5173,http://localhost:8080
    ports:
      - "9000:9000"
    volumes:
      - ../backend/src:/app/src
      - ../backend/medusa-config.js:/app/medusa-config.js
      - ../backend/package.json:/app/package.json
    command: >
      sh -c "
        medusa migrations run &&
        medusa seed --seed-file data/seed.js &&
        medusa develop
      "
    networks:
      - binishop-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  binishop-network:
    driver: bridge
    name: binishop-network