# ==========================================
# BINISHOP — Configuration Redis
# ==========================================

# Persistance AOF (Append Only File)
appendonly yes
appendfsync everysec

# Désactiver RDB snapshots (AOF suffit)
save ""

# Sécurité (le mot de passe est passé via --requirepass dans docker-compose)
# Ne pas stocker le mot de passe ici

# Performance
tcp-keepalive 300
timeout 0
maxmemory-policy allkeys-lru

# Limiter les connexions
maxclients 10000

# Logs
loglevel notice